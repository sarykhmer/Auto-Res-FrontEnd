<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Sign in | Auto-Responder</title>
    <style>
        :root {
            color: #172033;
            background: #f3f6fb;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-synthesis: none;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background:
                radial-gradient(ellipse at 12% 10%, #dce8ff 0, transparent 38%),
                radial-gradient(ellipse at 88% 90%, #d9f4ed 0, transparent 34%),
                #f3f6fb;
        }

        main {
            width: min(100%, 410px);
            padding: 38px;
            border: 1px solid #e4e9f2;
            border-radius: 20px;
            background: rgb(255 255 255 / 94%);
            box-shadow: 0 24px 70px rgb(26 45 82 / 12%);
        }

        .mark {
            display: grid;
            width: 48px;
            height: 48px;
            margin-bottom: 25px;
            border-radius: 14px;
            color: #fff;
            background: #3156d3;
            font-size: 23px;
            font-weight: 700;
            place-items: center;
        }

        h1 {
            margin: 0;
            font-size: 27px;
            letter-spacing: -0.7px;
        }

        .subtitle {
            margin: 9px 0 28px;
            color: #69758b;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-size: 13px;
            font-weight: 650;
        }

        input {
            width: 100%;
            height: 47px;
            padding: 0 13px;
            border: 1px solid #d6deea;
            border-radius: 9px;
            outline: none;
            background: #fff;
            color: #172033;
            font: inherit;
        }

        input:focus {
            border-color: #3156d3;
            box-shadow: 0 0 0 3px rgb(49 86 211 / 13%);
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 25px;
            border: 0;
            border-radius: 9px;
            color: #fff;
            background: #3156d3;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }

        button:hover {
            background: #2648bc;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        #error {
            min-height: 20px;
            margin: 13px 0 0;
            color: #b42318;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            main {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="mark" aria-hidden="true">AN</div>
        <h1>Welcome back</h1>
        <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="submitButton" type="submit">Sign in</button>
            <p id="error" role="alert" aria-live="polite"></p>
        </form>
    </main>
    <script>
        const form = document.getElementById('loginForm');
        const submitButton = document.getElementById('submitButton');
        const error = document.getElementById('error');
        const REMOTE_API_BASE = 'https://tz7s8z8q9k.apps.bot-hosting.cloud';
        const apiOverride = new URLSearchParams(location.search).get('api');
        const API_BASES = apiOverride
            ? [apiOverride]
            : (location.protocol.startsWith('http') ? ['', REMOTE_API_BASE] : [REMOTE_API_BASE]);

        if (sessionStorage.getItem('authToken')) {
            location.replace('controler.html' + location.search);
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();
            error.textContent = '';
            submitButton.disabled = true;
            submitButton.textContent = 'Signing in…';

            const credentials = {
                username: form.elements.username.value,
                password: form.elements.password.value
            };
            let lastError = 'Cannot reach the server. Check your connection and try again.';

            try {
                for (const base of API_BASES) {
                    const url = base.replace(/\/+$/, '') + '/api/login';
                    let response;
                    try {
                        response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(credentials),
                            cache: 'no-store'
                        });
                    } catch {
                        continue;
                    }

                    if (response.status === 404 || response.status === 405) continue;
                    if (response.status === 401) {
                        lastError = 'The username or password is incorrect.';
                        break;
                    }
                    if (!response.ok) {
                        lastError = 'Sign in failed. Please try again.';
                        break;
                    }

                    const result = await response.json();
                    if (typeof result.token !== 'string') {
                        lastError = 'The server returned an invalid sign-in response.';
                        break;
                    }

                    sessionStorage.setItem('authToken', result.token);
                    location.replace('controler.html' + location.search);
                    return;
                }
                error.textContent = lastError;
            } catch {
                error.textContent = 'Could not complete sign in. Please try again.';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Sign in';
            }
        });
    </script>
</body>

</html>
